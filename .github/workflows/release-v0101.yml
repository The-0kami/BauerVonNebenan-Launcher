name: Build Agriculture Science v0.10.1

on:
  push:
    branches: [main]
    paths:
      - "release_tools/v0.10.1.zip.b64"
      - ".github/workflows/release-v0101.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recreate v0.10.1 package
        run: |
          base64 -d release_tools/v0.10.1.zip.b64 > BauerVonNebenan_AgricultureScience_Launcher_v0.10.1.zip
          unzip -p BauerVonNebenan_AgricultureScience_Launcher_v0.10.1.zip BauerVonNebenan/BauerVonNebenan_Launcher.ps1 | grep -F "0.10.1"
          unzip -p BauerVonNebenan_AgricultureScience_Launcher_v0.10.1.zip BauerVonNebenan/BauerVonNebenan_Launcher.ps1 | grep -F "Ensure-SteamLaunchOptionFile"
          unzip -p BauerVonNebenan_AgricultureScience_Launcher_v0.10.1.zip BauerVonNebenan/BauerVonNebenan_Launcher.ps1 | grep -F "Invoke-StrictModQuarantine"
          unzip -p BauerVonNebenan_AgricultureScience_Launcher_v0.10.1.zip BauerVonNebenan/config.ini | grep -F "StrictQuarantineFolder=strict_quarantine"
          sha256sum BauerVonNebenan_AgricultureScience_Launcher_v0.10.1.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.10.1 >/dev/null 2>&1; then
            gh release upload v0.10.1 \
              BauerVonNebenan_AgricultureScience_Launcher_v0.10.1.zip \
              --clobber
          else
            gh release create v0.10.1 \
              BauerVonNebenan_AgricultureScience_Launcher_v0.10.1.zip \
              --target main \
              --title "Agriculture Science Runtime v0.10.1" \
              --notes "Steam_Startoption.txt is generated once on Windows. Adds opt-in RemoteModListMode=Strict while keeping Additive as the default. Strict synchronizes against the remote master list and moves local extra ZIP mods into timestamped strict_quarantine folders instead of deleting them."
          fi
